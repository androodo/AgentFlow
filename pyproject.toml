[project]
name = "agentflow"
version = "0.1.0"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["integration: requires running AgentFlow and PostgreSQL services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
